name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  cargo-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo tests
        run: cargo test --workspace --verbose

  security-scan:
    name: Security & dependency scans
    runs-on: ubuntu-latest
    needs: cargo-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit || true

      - name: Run cargo audit
        run: cargo audit || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependency audit for repo
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
            yarn audit || true
          elif [ -f package-lock.json ]; then
            npm ci
            npm audit --audit-level=moderate || true
          fi

      - name: Dependency audit for sdk
        working-directory: sdk
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
            yarn audit || true
          elif [ -f package-lock.json ]; then
            npm ci
            npm audit --audit-level=moderate || true
          fi

  sdk-tests:
    name: SDK unit tests
    runs-on: ubuntu-latest
    needs: cargo-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SDK deps
        working-directory: sdk
        run: yarn install --frozen-lockfile

      - name: Run SDK tests
        working-directory: sdk
        run: yarn test

  anchor-test:
    name: Anchor integration tests
    runs-on: ubuntu-latest
    needs: [cargo-test, security-scan, sdk-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Cache Agave/Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: ${{ runner.os }}-agave-v3.1.10

      - name: Install Agave/Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 5 https://release.anza.xyz/v3.1.10/install | sh

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-cli-v1.0.2

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            --tag v1.0.2 \
            --locked \
            anchor-cli

      - name: Cache program build artifacts
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cache/solana
          key: ${{ runner.os }}-program-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-program-target-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-program-target-

      - name: Show versions
        run: |
          solana --version
          anchor --version

      - name: Generate test keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --outfile ~/.config/solana/id.json

      - name: Run anchor test
        run: anchor test