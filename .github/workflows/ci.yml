name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  cargo-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo tests
        run: |
          cargo test -p jetty --workspace --verbose

  anchor-test:
    name: Anchor integration tests
    runs-on: ubuntu-latest
    needs: [cargo-test, security-scan, sdk-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        working-directory: .
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f yarn.lock ]; then yarn install --frozen-lockfile; fi

      # 1. Cache Solana CLI Installation (Saves ~1-2 minutes)
      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: ${{ runner.os }}-solana-v1.14.17

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 5 https://solana.com | sh

      # CHANGED: Replaced "~" with "$HOME" so GitHub Actions correctly parses the absolute path
      - name: Add Solana to Path
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      # 2. Cache Cargo Binaries for Anchor CLI (Saves ~3-5 minutes)
      - name: Cache Anchor CLI Bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-v0.27.0

      - name: Install Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-v0.27.0

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        # Removed the invalid runner.home context assignment
        run: |
          rustup default stable
          cargo install --git https://github.com --tag v0.27.0 --locked --bin anchor-cli || cargo install anchor-cli || true

      # 3. Cache Solana Smart Contract target/ build artifacts (Saves ~2-4 minutes)
      - name: Cache Solana Program Build Targets
        uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cache/solana
          key: ${{ runner.os }}-program-target-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-program-target-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-program-target-

      - name: Show versions
        run: |
          solana --version || true
          anchor --version || true

      - name: Run anchor test
        env:
          ANCHOR_WALLET: ${{ runner.temp }}/test-keypair.json
        run: |
          anchor test

  security-scan:
    name: Security & dependency scans
    runs-on: ubuntu-latest
    needs: cargo-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: |
          rustup component add rustfmt || true
          cargo install cargo-audit || true

      - name: Run cargo audit
        run: |
          cargo audit || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependency audit for repo
        run: |
          if [ -f package-lock.json ]; then npm ci; npm audit --audit-level=moderate || true; elif [ -f yarn.lock ]; then yarn install --frozen-lockfile; yarn audit || true; fi

      - name: Dependency audit for sdk
        working-directory: sdk
        run: |
          if [ -f package-lock.json ]; then npm ci; npm audit --audit-level=moderate || true; elif [ -f yarn.lock ] || [ -f ../yarn.lock ]; then yarn install --frozen-lockfile; yarn audit || true; fi

  sdk-tests:
    name: SDK unit tests
    runs-on: ubuntu-latest
    needs: cargo-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SDK deps
        working-directory: sdk
        run: |
          if [ -f package-lock.json ]; then npm ci; else yarn install --frozen-lockfile; fi

      - name: Run SDK tests
        working-directory: sdk
        run: |
          if [ -f package-lock.json ]; then npm test; else yarn test; fi
