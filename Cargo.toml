[workspace]
members = [
    "programs/*"
]
resolver = "2"

[patch.crates-io]
spl-token-2022-interface = { path = "vendor/spl-token-2022-interface" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
